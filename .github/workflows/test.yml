name: Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      # separate steps instead of check:fast to run all tests in one jest run
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run game and generation tests with coverage
        run: npm run test:ci
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov-report
      - name: Verify wiki
        run: npm run wiki:test
      - name: Build wiki
        run: npm run wiki:build
