name: Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    # separate steps instead of check:fast to run all tests in one jest run
    - name: Type check
      run: npm run typecheck
    - name: Lint
      run: npm run lint
    - name: Run all tests
      run: npm run test:all
