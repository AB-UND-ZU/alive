name: Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: sh scripts/install-browser.sh
      - name: Lint
        run: npm run lint
      - name: Run game and generation tests with coverage
        run: npm run test:ci
      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov-report
      - name: Verify wiki
        run: npm run wiki:test
      # build type checks, but skips its own lint
      - name: Verify client build tooling
        run: npm run build:test
      - name: Build ThreeJS, HTML and Terminal clients
        run: npm run build
        env:
          DISABLE_ESLINT_PLUGIN: true
      - name: Build wiki under /wiki
        run: BUILD_PATH=build/wiki npm run wiki:build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./build
